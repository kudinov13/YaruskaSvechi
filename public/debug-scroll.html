<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug scroll</title>
<style>
  body { margin: 0; background: #fff; font-family: monospace; padding: 16px; }
  #info { position: fixed; top: 0; left: 0; right: 0; background: #fff; border-bottom: 1px solid #000; padding: 8px; z-index: 9999; font-size: 11px; }
</style>
</head>
<body>
<div id="info">Loading...</div>
<iframe id="frame" src="/" style="width:414px;height:800px;border:0;display:block;"></iframe>
<script>
const frame = document.getElementById('frame');
const info = document.getElementById('info');
frame.onload = () => {
  try {
    const doc = frame.contentDocument;
    const html = doc.documentElement;
    const body = doc.body;
    const root = doc.getElementById('root');
    const offenders = [];
    const all = doc.querySelectorAll('*');
    all.forEach(el => {
      const rect = el.getBoundingClientRect();
      if (rect.right > 414 + 1 || rect.left < -1) {
        offenders.push({
          tag: el.tagName,
          class: el.className,
          id: el.id,
          left: Math.round(rect.left),
          right: Math.round(rect.right),
          width: Math.round(rect.width),
          scrollWidth: el.scrollWidth,
          offsetParent: el.offsetParent ? el.offsetParent.tagName : null
        });
      }
    });
    info.textContent = 'html.scrollWidth=' + html.scrollWidth + ' body.scrollWidth=' + body.scrollWidth + ' offenders=' + offenders.length;
    console.log('OFFENDERS:', JSON.stringify(offenders, null, 2));
    window.__offenders = offenders;
  } catch(e) { info.textContent = 'Error: ' + e.message; }
};
</script>
</body>
</html>
